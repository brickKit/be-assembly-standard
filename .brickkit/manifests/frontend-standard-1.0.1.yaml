apiVersion: brickkit/v1
kind: Component
metadata:
  id: frontend/standard
  name: 标准前端
  version: 1.0.1
                                      # v1.0.1：同 infra/bff-mobile 这次改动，构建阶段的基底镜像从 node:20-slim 升到 node:24-slim，package.json 的 engines.node 改成 >=24，理由同上（Node 版本统一升级，不是这个组件自己发现的问题）。无业务行为/契约变更。
  description: PC（Vue3 SPA）+ 移动端（Uni-app）标准前端，动态特性路由（features ∩ permissions）
artifacts:
  - { type: metadata, files: [assembly.yaml] }
dependencies:
  components: []                     # 前端不依赖任何后端组件：它只认网关（design.md §5）
  resources: []
configSchema:
  type: object
  properties:
    gatewayBaseUrl: { type: string, default: "/" }
    iamIssuerUrl:   { type: string }
    # ⚠️ 设计书 §3.5.2 的示例只给了以上两项。真机核实 Casdoor 的标准 OIDC
    # 流程（浏览器直连 /login/oauth/authorize）后发现光有 issuer 地址不够，
    # public client 的 authorize 请求还需要一个 client_id（公开值，本身
    # 不是密钥，PKCE 保护授权码本身）——这是设计书示例遗漏的一项，不是
    # 本组件自己引入的复杂度。见 docs/design/frontend-standard.md §9 第 5 条。
    casdoorClientId: { type: string }
deployment:
  type: container
  image: brickenterprise/frontend-standard:1.0.1
  port: 80
healthCheck: { type: http, path: / }
