name: be-infra

networks:
  be-net:
    external: true

volumes:
  pg_data:
  nats_data:
  rustfs_data:
  minio_data:
  kafka_data:
  rmq_data:

services:
  # ① PostgreSQL —— 共享单一 Database + 每组件独立 Schema（决策 3）
  postgres:
    image: postgres:16-alpine
    container_name: be-postgres
    networks: [be-net]
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 里设置}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 只建 brickkit_db + casdoor/keycloak 两个非组件 schema，供带外容器在
      # be-ops 产出 2（Task 8）之前就能起来。组件的 schema/role 不许写进去。
      # ⚠️ 仅在 pg_data 卷为空时跑一次。
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ② NATS —— 事件总线（默认）。JetStream 必开
  nats:
    image: nats:2.10-alpine
    container_name: be-nats
    networks: [be-net]
    ports: ["4222:4222", "8222:8222"]
    # ⚠️ 实测修正：max_payload 不是 CLI flag（--help 里没有），只能走配置
    # 文件；--jetstream/--store_dir/--http_port 三个是合法 CLI flag，留在这里
    command: ["-c", "/etc/nats/nats.conf", "--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ③ Traefik —— API 网关（默认）。Dashboard 8080 → 28080（总纲 §1.2：1xxxx 整段归平台）
  traefik:
    image: traefik:v3.0
    container_name: be-traefik
    networks: [be-net]
    ports: ["80:80", "443:443", "28080:28080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # be-ops 产出的 file provider 动态配置放这里（决策 107）。
      # 阶段一还没有组件，目录先建出来放一个 .gitkeep 即可。
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ④ Casdoor —— IAM 认证（默认）。带外容器，不进 brickkit.yaml
  casdoor:
    image: casbin/casdoor:latest
    container_name: be-casdoor
    networks: [be-net]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      # ⚠️ 整串 DSN 在这里拼好再注入，app.conf 里只写 ${CASDOOR_DSN}。
      #    beego 的 ExpandValueEnv 只在「整个值就是一个 ${VAR}」时才展开，
      #    嵌在字符串中间不展开（已实测：会 panic pq: password authentication
      #    failed，而 PostgreSQL 自己 healthy，看起来像 Casdoor 的毛病）。
      #    compose 这一层的插值没有这个限制，所以拼接放在这里做。
      CASDOOR_DSN: "user=postgres password=${POSTGRES_PASSWORD:?} host=be-postgres port=5432 sslmode=disable dbname=brickkit_db search_path=casdoor"
    volumes:
      - ./casdoor/conf:/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/api/health || curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ⑤ RustFS —— 对象存储（默认）
  rustfs:
    image: rustfs/rustfs:latest
    container_name: be-rustfs
    networks: [be-net]
    ports: ["9000:9000"]
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY 必须在 .env 里设置}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY 必须在 .env 里设置}
    volumes: [rustfs_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/health/live || curl -fsS http://localhost:9000/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===== 以下全部是可选替换件，靠 profile 开启，默认不启动 =====

  minio:
    image: minio/minio:latest
    container_name: be-minio
    profiles: [minio]
    networks: [be-net]
    ports: ["9000:9000", "9001:9001"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: be-keycloak
    profiles: [keycloak]
    networks: [be-net]
    ports: ["28081:8080"]
    command: ["start-dev", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://be-postgres:5432/brickkit_db?currentSchema=keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: be-kafka
    profiles: [kafka]
    networks: [be-net]
    ports: ["29092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://be-kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@be-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: brickenterprise-dev-cluster
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: be-rabbitmq
    profiles: [rabbitmq]
    networks: [be-net]
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-brickkit}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:?}
    volumes: [rmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.25-alpine
    container_name: be-nginx
    profiles: [nginx]
    networks: [be-net]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
