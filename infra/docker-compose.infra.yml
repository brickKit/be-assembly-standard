name: be-infra

networks:
  be-net:
    external: true
  # 本项目的组件网络：项目自己提供（brickKit v1.2.0 的部署文件顶层 network:，deploy.yaml 里写同一个名字），
  # 由 make net 用普通的 docker network create 预先建好；这里和 brickKit 生成的 compose 都把它当 external，
  # 只加入、不建不删，所以基础资源与组件谁先起、谁先 down 都不冲突。只有 Casdoor 接进去：它要按成员自己的
  # 服务名回调 infra/iam-casdoor 的 webhook（config/vars.yaml 的 IAM_WEBHOOK_CALLBACK_URL），单独部署与
  # 外壳托管都解析得到（成员服务名是外壳容器的网络别名）。改名时三处一起改：这里、deploy*.yaml 的 network:。
  brickkit-net:
    external: true
    name: brickkit-be-assembly-standard-net

volumes:
  pg_data:
  nats_data:
  rustfs_data:
  seaweedfs_data:
  kafka_data:

services:
  # ① PostgreSQL —— 共享单一 Database + 每组件独立 Schema（决策 3）
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: be-postgres
    networks: [be-net]
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 里设置}
      POSTGRES_DB: postgres
    # pg_stat_statements: per-statement time and calls, for finding where the database spends its CPU (about 1-2 %).
    # idle_in_transaction_session_timeout: a session left in an open transaction after a write (a forgotten psql BEGIN)
    # holds the PostgreSQL queue's xid barrier for the whole instance; the components' own transactions set 10 s.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "idle_in_transaction_session_timeout=60s"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 只建 brickkit_db + casdoor/keycloak 两个非组件 schema，供带外容器在
      # be-ops 产出 2（Task 8）之前就能起来。组件的 schema/role 不许写进去。
      # ⚠️ 仅在 pg_data 卷为空时跑一次。
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ② NATS —— 事件总线（默认）。JetStream 必开
  nats:
    image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: be-nats
    networks: [be-net]
    ports: ["4222:4222", "8222:8222"]
    # ⚠️ 实测修正：max_payload 不是 CLI flag（--help 里没有），只能走配置
    # 文件；--jetstream/--store_dir/--http_port 三个是合法 CLI flag，留在这里
    command: ["-c", "/etc/nats/nats.conf", "--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ③ Traefik —— API 网关（默认）。Dashboard 8080 → 28080（总纲 §1.2：1xxxx 整段归平台）
  traefik:
    image: traefik:v3.0.4@sha256:a208c74fd80a566d4ea376053bff73d31616d7af3f1465a7747b8b89ee34d97e
    container_name: be-traefik
    networks: [be-net]
    ports: ["80:80", "443:443", "28080:28080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # be-ops 产出的 file provider 动态配置放这里（决策 107）。
      # 阶段一还没有组件，目录先建出来放一个 .gitkeep 即可。
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ④ Casdoor —— IAM 认证（默认）。带外容器，不进 brickkit.yaml
  casdoor:
    image: casbin/casdoor:4.1.0@sha256:1c4424819af678635d55e6979088761f526fe5a58f331ba94c371c4c0c81521f
    container_name: be-casdoor
    networks: [be-net, brickkit-net]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      # ⚠️ 整串 DSN 在这里拼好再注入，app.conf 里只写 ${CASDOOR_DSN}。
      #    beego 的 ExpandValueEnv 只在「整个值就是一个 ${VAR}」时才展开，
      #    嵌在字符串中间不展开（已实测：会 panic pq: password authentication
      #    failed，而 PostgreSQL 自己 healthy，看起来像 Casdoor 的毛病）。
      #    compose 这一层的插值没有这个限制，所以拼接放在这里做。
      CASDOOR_DSN: "user=postgres password=${POSTGRES_PASSWORD:?} host=be-postgres port=5432 sslmode=disable dbname=brickkit_db search_path=casdoor"
    volumes:
      - ./casdoor/conf:/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/api/health || curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ⑤ RustFS —— 对象存储（默认）
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    container_name: be-rustfs
    networks: [be-net]
    ports: ["9000:9000"]
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY 必须在 .env 里设置}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY 必须在 .env 里设置}
    volumes: [rustfs_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/health/live || curl -fsS http://localhost:9000/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===== 以下全部是可选替换件，靠 profile 开启，默认不启动 =====

  # SeaweedFS 的单进程模式（mini：主节点、卷、文件层与 S3 一起），S3 接口发布在宿主机 9000，与 RustFS 互换时
  # 组件与测试的地址不用改；凭据由 AWS_* 环境变量建成管理员身份，匿名访问被拒绝；关掉默认的匿名统计上报
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: be-seaweedfs
    profiles: [seaweedfs]
    networks: [be-net]
    ports: ["9000:8333"]
    command: ["mini", "-dir=/data", "-s3.port=8333", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?}
    volumes: [seaweedfs_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    container_name: be-keycloak
    profiles: [keycloak]
    networks: [be-net]
    ports: ["28081:8080"]
    command: ["start-dev", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://be-postgres:5432/brickkit_db?currentSchema=keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  kafka:
    image: confluentinc/cp-kafka:8.3.1@sha256:0ad069035863aa1b090f4d9af47bfd2c08dc32864f3575d7d8579e3155c2586d
    container_name: be-kafka
    profiles: [kafka]
    networks: [be-net]
    ports: ["29092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://be-kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@be-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: brickenterprise-dev-cluster
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: be-nginx
    profiles: [nginx]
    networks: [be-net]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
