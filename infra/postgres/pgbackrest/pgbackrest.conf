# pgBackRest for be-postgres (A135): the repository in its own volume; two full backups kept, the WAL they need with
# them. process-max=1 and a synchronous archive-get: a development machine (T2a).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
process-max=1
start-fast=y
log-level-console=info
log-level-file=off

[main]
pg1-path=/var/lib/postgresql/data
