name: be-obs

networks:
  be-net:
    external: true

volumes:
  prom_data:
  loki_data:
  tempo_data:
  grafana_data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: be-otel
    networks: [be-net]
    ports: ["4317:4317", "4318:4318", "13133:13133"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: be-prometheus
    networks: [be-net]
    ports: ["29090:9090"]
    # ⚠️ --web.enable-remote-write-receiver：otel-collector 的 prometheusremotewrite
    #    exporter 要往 /api/v1/write 推，Prometheus 默认不开这个接收端点。
    #    不开的症状是 collector 日志刷 404，而 Prometheus 自己一切正常。
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
      # Prometheus 的 docker_sd_configs 要读 docker.sock（Task 1 步骤 6 的 ⚠️）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:latest
    container_name: be-loki
    networks: [be-net]
    ports: ["3100:3100"]
    volumes: [loki_data:/loki]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tempo:
    image: grafana/tempo:latest
    container_name: be-tempo
    networks: [be-net]
    ports: ["3200:3200"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: be-grafana
    networks: [be-net]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes: [grafana_data:/var/lib/grafana]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
