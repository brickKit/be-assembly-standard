name: be-obs

networks:
  be-net:
    external: true

volumes:
  prom_data:
  loki_data:
  tempo_data:
  grafana_data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: be-otel
    networks: [be-net]
    ports: ["4317:4317", "4318:4318", "13133:13133"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    # ⚠️ 实测发现：这个镜像没有 shell（/bin/sh 都不存在），也没有 wget/curl，
    # otelcol-contrib 二进制本身也没有 healthcheck 子命令——容器内自检
    # physically 做不到。CMD-SHELL 形态的健康检查在这种镜像上必然失败，
    # 症状是 unhealthy、日志是 "exec: /bin/sh: stat /bin/sh: no such file
    # or directory"（十八条第 8 条 FROM scratch/distroless 的同一类坑，
    # 只是这次踩在带外镜像上，不是我们自己的组件）。
    # 正解：不给这个 service 定义 healthcheck。compose --wait 对没有
    # healthcheck 的服务只等到 running 就放行，不会卡在 180 秒超时上。
    # 想确认它真的活着，从宿主机侧查（它监听在 13133，宿主机有 curl）：
    #   curl -fsS http://localhost:13133/   → {"status":"Server available",...}

  prometheus:
    image: prom/prometheus:latest
    container_name: be-prometheus
    networks: [be-net]
    ports: ["29090:9090"]
    # ⚠️ --web.enable-remote-write-receiver：otel-collector 的 prometheusremotewrite
    #    exporter 要往 /api/v1/write 推，Prometheus 默认不开这个接收端点。
    #    不开的症状是 collector 日志刷 404，而 Prometheus 自己一切正常。
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
      # Prometheus 的 docker_sd_configs 要读 docker.sock（Task 1 步骤 6 的 ⚠️）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:latest
    container_name: be-loki
    networks: [be-net]
    ports: ["3100:3100"]
    volumes: [loki_data:/loki]
    # ⚠️ 实测发现：这个镜像同样没有 shell（同 otel-collector 那条注释），
    # CMD-SHELL 形态的健康检查必然失败。不给它定义 healthcheck。
    # 另外顺带记一件不是 bug 的事：单体模式的 Loki 在 ingester 加入 ring
    # 之后会**再等一段 grace period（约 15 秒）才报 ready**——这是 Loki
    # 自己的正常行为（single-binary 模式的 min_ready_duration），不是我们
    # 配置的问题。启动后短时间内 curl /ready 得到 503（"Ingester not ready:
    # waiting for 15s after being ready"）属于预期。
    #   curl -fsS http://localhost:3100/ready   → 一段时间后变成 "ready"

  tempo:
    image: grafana/tempo:latest
    container_name: be-tempo
    networks: [be-net]
    ports: ["3200:3200"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # ⚠️ 实测发现：这个镜像也没有 shell，同 otel-collector/loki 那条注释。
    #   curl -fsS http://localhost:3200/ready   → "ready"

  grafana:
    image: grafana/grafana:latest
    container_name: be-grafana
    networks: [be-net]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes: [grafana_data:/var/lib/grafana]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
