appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = postgres
# ⚠️ 整个值必须就是一个 ${VAR}，不能把 ${VAR} 嵌在字符串中间。
# beego 的 ExpandValueEnv 只在「整个值以 ${ 开头、以 } 结尾」时才展开；
# 写成 "...password=${POSTGRES_PASSWORD}..." 的话那串是字面量，
# 症状是 Casdoor 反复重启、日志里 panic: pq: password authentication failed
# —— 而 PostgreSQL 自己 healthy，看起来像 Casdoor 的毛病。（已实测）
# DSN 整串由 compose 拼好后注入，见 docker-compose.infra.yml 的 casdoor 服务。
dataSourceName = ${CASDOOR_DSN}
dbName =
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy = ""
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
# ⚠️ 必须带端口——OIDC 发现文档的 issuer/jwks_uri 都是从这个值原样拼出来
# 的（真机核对过：漏了端口，任何按标准做 OIDC Discovery 的调用方拿到的
# jwks_uri 都会指向一个打不通的地址，见 infra-iam-casdoor 组件的
# docs/dev/实测踩坑记录.md）。这里的端口必须与上面 httpport 及
# docker-compose.infra.yml 的宿主机映射端口（8000:8000）一致。
origin = "http://localhost:8000"
staticBaseUrl = "https://cdn.casbin.org"
