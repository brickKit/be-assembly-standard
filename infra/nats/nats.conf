# nats-server 配置文件。只放「不能用 CLI flag 表达」的那部分。
#
# ⚠️ 实测发现：max_payload 不是 nats-server 的 CLI 参数（--help 里没有它，
# 只有配置文件指令）。原计划把它写进 compose 的 command 数组
# （--max_payload 8MB），实际效果是 "flag provided but not defined:
# -max_payload"，容器打印用法说明后退出、Docker 判定为 Exited(2)、
# restart: unless-stopped 让它不断重启——这条症状很容易被误判成
# "健康检查配置错了"，因为看起来像是启动慢；实际是命令行参数本身非法。
#
# jetstream / store_dir / http_port 三个是合法的 CLI flag，继续留在
# compose 的 command 里，不必都搬进这个文件。
max_payload: 8MB
