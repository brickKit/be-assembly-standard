[project]
name = "be-py-render"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["besdk @ git+https://github.com/brickKit/be-sdk-python.git@v0.4.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 外壳只有一个入口模块；成员组件作为依赖装进来，不在这里打包
py-modules = ["main"]
