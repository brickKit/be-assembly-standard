# Object storage backends (performance, about 4 minutes per backend): the same D-S big events on SeaweedFS 4.48 and on
# RustFS 1.0.0-beta.12, one right after the other; the run script switches the backend between the two.
runs: 1
cells:
  - {cell: D-S, ops: [big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
