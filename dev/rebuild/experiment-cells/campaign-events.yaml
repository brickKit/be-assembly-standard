# The event paths of every load cell after P7.21 (a commit that enqueues work wakes a worker): write, relay and the
# big event at 50/s and 200/s, short windows, under the performance power profile. With round 5 (base cells, D-S and
# D-H1 for every operation) it gives the D row in one power profile; the calls did not change.
runs: 1
cells:
  - {cell: D-S, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H1, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H2, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-X, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-S-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H1-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H2-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-X-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
