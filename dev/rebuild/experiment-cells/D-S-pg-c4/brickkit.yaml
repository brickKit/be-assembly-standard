# brickkit.yaml — what this project is made of: its sources and the exact component versions.
# Shared and reviewed like code: commit it.
project: d-s-pg-c4

# Install sources, tried in declaration order
sources:
  - name: local-dev
    type: local
    path: ./components # brickkit init already created this directory
  - name: local-shells
    type: local
    path: ./shell # shells (kind: shell) are project code: brickkit new --shell writes here
  - name: acceptance # the probes (one repository, tags test-probe-<variant>/<version>)
    type: git
    repo: https://github.com/brickKit/be-acceptance
  - name: brickkit-github # one component per repository (the shells): be/go-core -> be-go-core
    type: git
    baseUrl: https://github.com/brickKit/
# More sources: uncomment and fill in the address
# - name: company-git
#   type: git
#   baseUrl: https://git.example.com/components/
# - name: market
#   type: market
#   url: https://market.example.com/api/v1

components:
  - id: test/probe-go
    version: 3.2.12
  - id: test/probe-go2
    version: 3.2.12
  - id: test/probe-py
    version: 3.2.12
  - id: test/probe-py2
    version: 3.2.12
