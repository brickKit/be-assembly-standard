# Step 5 (T5.7), under the performance power profile (about an hour): what real authorization and audit cost on every
# path. D5-S0 (probes alone, no security members), D5-S (the same probes with tokens, views and audit, the security
# members alone) and D5-H (the security members and the Go probe in the be-go-infra shell), alternated, twice.
runs: 2
cells:
  - {cell: D5-S0, loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D5-S, loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D5-H, loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
