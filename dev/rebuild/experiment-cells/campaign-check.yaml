# A full check of every D cell after a change below the cells (SDK, shells, BrickKit): every operation at 50/s and
# 200/s, short windows; not part of the results. The watcher's plausibility limits catch a path that is slow while
# every request succeeds.
runs: 1
cells:
  - {cell: D-base-go, idle_only: true, idle: 30}
  - {cell: D-base-py, idle_only: true, idle: 30}
  - {cell: D-base-goshell-1, idle_only: true, idle: 30}
  - {cell: D-base-goshell-2, idle_only: true, idle: 30}
  - {cell: D-base-goshell-4, idle_only: true, idle: 30}
  - {cell: D-base-pyshell-1, idle_only: true, idle: 30}
  - {cell: D-base-pyshell-2, idle_only: true, idle: 30}
  - {cell: D-S, loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H1, loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H2, loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-X, loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-S-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H1-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-H2-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
  - {cell: D-X-pg, ops: [write, relay, big-event], loads: [50, 200], idle: 15, warmup: 3, seconds: 10}
