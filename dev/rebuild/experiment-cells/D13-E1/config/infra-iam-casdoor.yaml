# Component: infra/iam-casdoor@3.0.15
# Environment variables for this component; every key is injected as-is.
# Shared variable: $var:NAME (config/vars.yaml) · environment variable: ${NAME} · local file: file://path
# Another component's address: $endpoint:<scope>/<name>

# === Required: startup is blocked until these have a value ===
CASDOOR_CLIENT_ID: ""  # string | the login application's client ID (authorization code)
CASDOOR_CLIENT_SECRET: ""  # string | secret
CASDOOR_PUBLIC_URL: ""  # string | Casdoor as the browser reaches it (the login page)
CASDOOR_URL: ""  # string | Casdoor on the back channel (token exchange, keys), e.g. http://be-casdoor:8000
DEPLOYMENT_ID: ""  # string | process-level: the same for every member of a shell; the tokens' audience is be:deployment:<DEPLOYMENT_ID>
IAM_CALLBACK_URL: ""  # string | the redirect URI registered for the application in Casdoor: <this member's public URL>/api/iam/callback
IAM_SIGNING_KEY: ""  # string | secret | the current signing key: PEM, Ed25519 (PKCS #8); usually IAM_SIGNING_KEY_FILE, re-read on rotation
IAM_TOKEN_ISSUER: ""  # string | the iss of the tokens this member signs; every component's IAM_ISSUER equals it
PG_DATABASE: ""  # string
PG_HOST: ""  # string
PG_PASSWORD: ""  # string | secret
PG_SCHEMA: ""  # string
PG_USER: ""  # string

# === Optional: commented keys use the component's default; uncomment to override ===
# AUDIT_GRPC_URL:  # string | process-level: the same for every member of a shell
# AUTHZ_GRPC_URL:  # string | process-level: the same for every member of a shell
# CASDOOR_ISSUER:  # string | the iss of Casdoor's ID tokens (its origin setting); default CASDOOR_PUBLIC_URL
# IAM_ACCESS_TOKEN_TTL:  # string | a duration (e.g. 2s, 500ms); default 5m (protocol 20)
# IAM_AFTER_LOGIN_URL:  # string | where the browser goes after a login without return_to; default /
# IAM_COOKIE_SECURE:  # boolean | the session cookie is Secure; default true (false only for plain-HTTP development)
# IAM_DEV_CLIENT_ID:  # string | the development client with the password grant (IAM_DEV_EXCHANGE)
# IAM_DEV_CLIENT_SECRET:  # string | secret
# IAM_DEV_EXCHANGE:  # boolean | development and test deployments only (A101): POST /api/iam/dev/token exchanges a user's password for a token; default false, and the go-live check confirms it is off
# IAM_ISSUER:  # string | process-level: the same for every member of a shell
# IAM_JWKS_URL:  # string | process-level: the same for every member of a shell
# IAM_SESSION_ABSOLUTE:  # string | a duration (e.g. 2s, 500ms); default 12h (protocol 20)
# IAM_SESSION_IDLE:  # string | a duration (e.g. 2s, 500ms); default 30m (protocol 20)
# IAM_SIGNING_KEY_NEXT:  # string | secret | the standby key, published in the JWKS before it signs; after a switch, the old key, until its tokens expire
# LOG_LEVEL:  # string | SDK default info
# OTEL_URL:  # string | process-level: the same for every member of a shell
# PG_IDLE_IN_TX_TIMEOUT:  # string | a duration (e.g. 2s, 500ms); SDK default 10s
# PG_LOCK_TIMEOUT:  # string | a duration (e.g. 2s, 500ms); SDK default 2s
# PG_MIGRATION_HOST:  # string
# PG_MIGRATION_PORT:  # integer
# PG_OWNER_PASSWORD:  # string | secret
# PG_OWNER_USER:  # string
# PG_POOLER_PREPARED:  # boolean | SDK default true
# PG_POOL_BACKGROUND:  # integer | SDK default 4
# PG_POOL_FOREGROUND:  # integer | SDK default 8
# PG_PORT:  # integer | SDK default 5432
# PG_STATEMENT_TIMEOUT:  # string | a duration (e.g. 2s, 500ms); SDK default 5s
# SERVICE_TLS_CA_FILE:  # string | secret | delivered as a file | a file path, re-read on rotation
# SERVICE_TLS_CERT_FILE:  # string | secret | delivered as a file | a file path, re-read on rotation
# SERVICE_TLS_KEY_FILE:  # string | secret | delivered as a file | a file path, re-read on rotation
# STOP_DRAIN_DELAY:  # string | a duration (e.g. 2s, 500ms); SDK default 2s
# STOP_TIMEOUT:  # string | a duration (e.g. 2s, 500ms); SDK default 30s
