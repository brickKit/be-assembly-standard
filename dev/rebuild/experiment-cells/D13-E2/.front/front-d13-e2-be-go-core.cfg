global
    log stdout format raw local0 notice
defaults
    mode http
    log global
    timeout connect 5s
    timeout client 120s
    timeout server 120s
resolvers engine
    parse-resolv-conf
    hold valid 1s
    hold obsolete 5s
frontend in
    bind :8090
    default_backend replicas
backend replicas
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server-template r 1-8 be-go-core-3-0-44:8090 check inter 1s resolvers engine init-addr none resolve-prefer ipv4
