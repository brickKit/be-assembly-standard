global
    log stdout format raw local0 notice
defaults
    mode http
    log global
    retries 2
    option redispatch
    timeout connect 1s
    timeout client 120s
    timeout server 120s
resolvers engine
    parse-resolv-conf
    hold valid 1s
    hold obsolete 5s
frontend in
    bind :8602
    default_backend replicas
backend replicas
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server-template r 1-8 test-probe-go2-3-2-32:8602 check inter 1s fall 2 rise 1 resolvers engine init-addr none resolve-prefer ipv4
