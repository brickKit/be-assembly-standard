# 全项目共享的配置值：多个组件重复用到的写在这里，组件的 config/<scope>-<name>.yaml
# 用 $var:<名> 引用。某个组件需要不同的值，就在它自己的文件里写字面量覆盖。
# 换环境 / 换拓扑：在对应部署文件（deploy.<env>.yaml）的 vars: 里覆盖，优先级高于本文件。

# PostgreSQL（make up 起的 be-postgres；组件容器通过 host-gateway 访问宿主机）
PG_HOST: host.docker.internal
PG_PORT: "5432"
PG_DATABASE: brickkit_db

# NATS（make up 起的 be-nats）
NATS_URL: nats://host.docker.internal:4222

# 对象存储（RustFS，S3 兼容；值是完整 URL）
S3_URL: http://host.docker.internal:9000

# 可观测性（未开 obs 时留空，SDK 视为关闭导出）
OTEL_BASE_URL: ""

# 权限与身份：用 brickKit 的 $endpoint:<组件 ID>[/路径]（v1.2.0 起）。值与 *_ENDPOINT 同一规则算出：
# 版本化服务名 + 端口（brickkit upgrade 后自动跟上，不用手改）；被外壳托管时指向外壳（外壳服务名 + 成员自己的端口），
# 本机进程（focus / mode: local / debug）换成本机地址；不进启动顺序、允许成环（authz ↔ iam 互相引用、各自引用自己都可以）。换槽位成员只改这里一行。
AUTHZ_BUNDLE_URL: $endpoint:infra/authz/authz/bundle
IAM_JWKS_URL: $endpoint:infra/iam-casdoor/.well-known/jwks.json

# Casdoor（基础资源，接在本项目网络上，见 deploy.yaml 的 network: 与 infra/docker-compose.infra.yml）回调
# infra/iam-casdoor 的 webhook：iam 引用自己，算出的是它自己的版本化服务名；被外壳托管时是外壳的服务名 + iam 自己的端口
# （v1.3.1 生成结果），Casdoor 在同一网络上同样解析得到。iam 自己以本机进程跑（focus）时这里会变成 localhost，Casdoor 回调不到。
IAM_WEBHOOK_CALLBACK_URL: $endpoint:infra/iam-casdoor/api/iam/webhooks/casdoor
