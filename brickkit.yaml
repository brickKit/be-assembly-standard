# brickkit.yaml - BrickKit 项目配置
# 由 brickkit init 生成，由用户编辑，由 CLI 读取
project: be-assembly-standard

deploy:
  target: docker # docker | k8s

# 安装源：按声明顺序依次尝试，前一个找不到就试下一个（003 §6.5）
sources:
  - id: local-dev
    type: local
    path: ./components # brickkit init 已经建好这个目录
  # 阶段四附加 Task 0.4：servedBy 落地后外壳本身也要有一份真实的
  # component.yaml，才能被成员组件的 servedBy 字段指向。外壳不算
  # components/ 下的 62 个业务组件之一（registry/README.md 规矩 3b），
  # manifest 放在各自外壳仓库自己的 deploy/ 子目录下，不跟真实组件混在
  # 一起，也不需要 assembly.yaml（be-ops 的 genyaml 只扫 ./components，
  # 不会碰这两个新源）。
  - id: shells-go
    type: local
    path: ./shells/go/deploy
  - id: shells-python
    type: local
    path: ./shells/python/deploy
# 组件市场按需取消注释并填上地址：
# - id: brickkit-market
#   type: market
#   url: https://market.example.com/api/v1

components:
  - id: mdm/customer
    version: 1.0.9 # v1.0.9：修复 scripts/seed.sh 在 brickKit servedBy 合并部署下失效的问题——原来靠 docker ps 按名字前缀找本组件自己的独立容器，servedBy 收编后没有独立容器，脚本直接报错退出。改成按 brickKit 自己给依赖方注入 *_ENDPOINT 时用的同一条地址转换规则（componentId+version 转小写、"/"和"."全部替换成"-"，brickKit 源码 internal/manifest/servicename.go 的 ServiceName()）直接拼目标地址，不再依赖独立容器存在。真机在 servedBy 部署下跑通 make seed。无业务行为/契约变更。
    # v1.0.8：删掉 deployment.labels 的 prometheus.io/port——阶段四附加 Task 0.1 真机验证 servedBy 时发现这个标签会跟同外壳其它成员的 prometheus.io/port 撞车报错（每个组件的值天然不同，servedBy 的 labels 合并规则没有排除这类"语义上必然因组件而异"的标签），已反馈给 brickKit。在 brickKit 修复或给出结论之前，暂时从这里删掉，只在合并后的外壳自己的条目上保留一份。无业务行为/契约变更。
    # v1.0.7：import-scan 门禁提前补上铁律六第二类白名单，理由同 erp/finance 这次改动（设计书§13.3）。本组件目前没有任何代码实际用到这条豁免，无行为变更。
    # ⚠️ 阶段四附加 Task 0.4：local:true 退休，改用 brickKit 原生的
    # servedBy——工作负载被 shell/go-core 收编，不再自己起容器（合并
    # 部署现在走平台原生机制而不是本仓库外壳的手写 shell-compose.yml，
    # 设计书 §13.1，见 docs/plans/04b-验证记录.md Task 0.4）
    servedBy: shell/go-core@0.4.8
    # v1.0.6：gen/mdm/customer 拆成独立嵌套 go module，理由与做法同 erp/finance 这次改动（阶段四调研记录 04 §13）。本仓库自己 standalone 构建/测试用本地 replace 完全不受影响，import-scan/单测全绿。无业务行为/契约变更。
    # v1.0.5：make seed 加量到 12 个客户，覆盖更多行业画像+信用额度区间，无破坏性变更。
    # v1.0.4：新增 make seed/seed-clean（总纲 SOP-W-7 种子数据归属样板首例）。
                   # v1.0.3：阶段三 Task 6，besdk.GET/POST/PATCH 的权限键从
                   # besdk.Public 换成 assembly.yaml 里声明的真实键，无破坏
