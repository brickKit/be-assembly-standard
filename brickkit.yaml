resources:
  # 设计书 §13.3 铁律二："brickkit.yaml 里只有 5 个外壳登录角色（5 个
  # resources 条目，同一个 host、不同凭据）"——凭据是 make db-init 早就
  # 建好、真机验证过能登录的 5 个外壳登录角色（registry/schemas.tsv 第
  # 4 列），不是这次新建的角色。
  #
  # ⚠️ 阶段四附加 Task 0.4：bindings 从"每个成员各自一条"改成"外壳自己
  # 一条"——brickKit 的 servedBy 合并只把 Source == SourceEndpoint 的
  # 变量（*_ENDPOINT）合进外壳容器的共享环境，DATABASE_*/MQ_* 这类"资源
  # 连接"变量是 Source == SourceResource，真正需要它的是外壳自己（持有
  # 连接池的那个进程），不是任何一个成员。只写外壳的 componentId 即可——
  # 曾经因为 brickKit 的资源绑定校验（CheckRunningResourceBindings）不
  # 认 servedBy，临时在这里给每个成员也重复绑了一份；这条已经在
  # brickKit v0.4.1 修好（servingShellID：外壳绑了就等价于成员也绑了），
  # 升级后去掉了那份临时绕过，完整过程见 docs/plans/04b-验证记录.md
  # Task 0.4。
  - id: postgres-go-core
    kind: database
    engine: postgresql
    host: host.docker.internal
    port: 5432
    username: shell_go_core
    password: ${SHELL_GO_CORE_PASSWORD}
    bindings:
      - componentId: shell/go-core
        database: brickkit_db
  - id: postgres-go-backoffice
    kind: database
    engine: postgresql
    host: host.docker.internal
    port: 5432
    username: shell_go_backoffice
    password: ${SHELL_GO_BACKOFFICE_PASSWORD}
    bindings:
      - componentId: shell/go-backoffice
        database: brickkit_db
  - id: postgres-go-infra
    kind: database
    engine: postgresql
    host: host.docker.internal
    port: 5432
    username: shell_go_infra
    password: ${SHELL_GO_INFRA_PASSWORD}
    bindings:
      - componentId: shell/go-infra
        database: brickkit_db
  - id: postgres-py-render
    kind: database
    engine: postgresql
    host: host.docker.internal
    port: 5432
    username: shell_py_render
    password: ${SHELL_PY_RENDER_PASSWORD}
    bindings:
      - componentId: shell/py-render
        database: brickkit_db
  - id: nats-shared
    kind: mq
    engine: nats
    host: host.docker.internal
    port: 4222
    bindings:
      # 同上：NATS 资源连接也是外壳自己持有一个共享连接，不是每个成员
      # 各自一条。
      - componentId: shell/go-core
      - componentId: shell/go-backoffice
      - componentId: shell/go-infra
      - componentId: shell/py-render
      - componentId: infra/print
      - componentId: crm/opportunity
