# brickkit.yaml - BrickKit 项目配置
# 由 brickkit init 生成，由用户编辑，由 CLI 读取
project: be-assembly-standard

deploy:
  target: docker # docker | k8s

# 安装源：按声明顺序依次尝试，前一个找不到就试下一个（003 §6.5）
sources:
  - id: local-dev
    type: local
    path: ./components # brickkit init 已经建好这个目录
# 组件市场按需取消注释并填上地址：
# - id: brickkit-market
#   type: market
#   url: https://market.example.com/api/v1

components:
  - id: mdm/customer
    version: 1.0.3 # v1.0.3：阶段三 Task 6，besdk.GET/POST/PATCH 的权限键从
                   # besdk.Public 换成 assembly.yaml 里声明的真实键，无破坏
                   # 性变更（判定本体走进程内 bundle map，组件代码不变）
    expose: true # 档 0 验收要用 curl 从宿主机直接打 HTTP（Task 17 步骤 2）。
                 # ⚠️ 只映射主端口（8080），额外端口（gRPC 9090）expose 与否
                 # 都不会映射到宿主机（brickKit internal/compose/local.go
                 # 的 mapDependencyToHost 注释原话："额外端口一个都不在里面"，
                 # 且那整套映射只在"被某个 local:true 组件依赖"时才生效——
                 # mdm-customer 没有被任何 local 组件依赖，gRPC 端口验收
                 # 只能走容器的 Docker 网络 IP，见 Task 17 步骤 3。
    config:
      # 阶段三 Task 6：bundle 轮询指向真实跑着的 infra-authz（内部 Docker
      # 网络地址，服务名带版本号——没有依赖边，brickKit 不会帮忙注入，
      # 只能手写字面量，infra/authz 升版本时这几处要跟着改）。
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      # 阶段三 Task 7：infra-iam-casdoor 建成，真实签发方第一次存在——
      # 同样是手写字面量的内部服务名，不是依赖边注入（这个组件对
      # infra-iam-casdoor 没有、也不该有依赖边，见它自己的 AGENTS.md
      # "零入边是 slot:iam 的物理前提"）。配上这一项之后 RequirePermission
      # 才第一次真正走到"验签 + 查 bundle"这条路径，不再是 fail-closed
      # stub。
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: mdm/product
    version: 1.0.3 # v1.0.3：同 mdm-customer，权限键从 besdk.Public 换成真实键
    expose: true # 同 mdm-customer：curl 打 HTTP 需要，gRPC 只能走容器 IP
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: erp/inventory
    version: 1.0.6 # v1.0.5：阶段三 Task 6，权限键换成真实键 + warehouse 维
                   # 数据权限真正生效（新增 warehouse_access 分配表 + 管理
                   # 接口），无破坏性变更（新表、新增可选字段）；v1.0.6：
                   # 升级 be-sdk-go 到 v0.2.4，修 gRPC handler panic 会崩
                   # 容器的严重问题（实测踩坑记录 C11），无破坏性变更
    expose: true # 同上：curl 打 HTTP 需要，gRPC 只能走容器 IP
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: erp/finance
    version: 1.0.3 # v1.0.3：阶段三 Task 6，权限键换成真实键 + legal_entity 维
                   # 数据权限真正生效（新增 legal_entity_access 分配表 + 管理
                   # 接口），无破坏性变更
    expose: true # 同上：curl 打 HTTP 需要，gRPC 只能走容器 IP
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: erp/sales
    version: 1.0.9 # v1.0.6：阶段三 Task 8 收尾，弱依赖 infra/workflow 真正接通——
                   # 补偿连续失败 3 次调 CreateTask 建异常待办，消费
                   # task.completed.v1 恢复订单（设计计划 §4.4.4），无破坏性变更；
                   # v1.0.7：依赖版本号同步 erp/inventory@1.0.6 + 升级 be-sdk-go
                   # 到 v0.2.4（修 gRPC handler panic 崩容器问题），无破坏性变更；
                   # v1.0.8：弱依赖版本号同步跟进 infra/workflow@1.0.1（补
                   # event_outbox 周分区维护循环，实测踩坑记录 C12），无破坏性变更；
                   # v1.0.9：阶段三 Task 14，真正消费 crm.opportunity.won.v1，
                   # 赢单自动转订单（附录 E 链路），无破坏性变更
    expose: true # 同上：curl 打 HTTP 需要，gRPC 只能走容器 IP。
                 # Task 18：五组件一起 up，跑通 CreateOrder → 预留库存 →
                 # 生成应收这条最短链路（docs/plans/02-阶段二-验平台.md）。
    config:
      # ConfirmOrder 发起 Reserve 时统一用这一个仓库（设计计划 §9 第 9 条：
      # 阶段二没有多仓选货逻辑）。"1" 是 erp-inventory 迁移播种的 WH-EAST
      # 的真实 id（003_seed_warehouses.up.sql，真机查过 warehouses 表）。
      defaultWarehouseId: "1"
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
      # 补偿连续失败 3 次时建的 infra-workflow exception 待办分配给谁——
      # 本阶段没有 mdm-org，先固定指派给这个占位 sub（设计计划 §4.4.4）。
      exceptionAssigneeSub: "u_ops_reviewer"
  - id: infra/authz
    version: 1.0.2 # v1.0.2：阶段三 Task 6，权限键换成真实键（/api/me/permissions
                   # 换 besdk.Authenticated，/api/admin/** 换 infra.authz.admin）+
                   # 临时的 X-Authz-Debug-Sub header 退役、改用真实验签后的
                   # Claims 取 sub，无破坏性变更
    expose: true # 同上：curl 打 HTTP 需要，gRPC 只能走容器 IP
    config:
      # 留空：阶段三还没有真实客户/角色数据，先不自举任何人——组件自己
      # 的 README「自举」一节：留空是合法状态，不是漏配置。
      bootstrapAdminSub: ""
      # 本组件自吃自己下发的 bundle（README「自我鉴权」一节）——地址
      # 指向自己，同其余五个组件一样是手写字面量，不是依赖边注入。
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
      # ⚠️ Task 14 真机测试时发现的系统性缺口：这一项从建仓库起就从未被
      # 填过——be-ops 的 permissions 子命令只写 registry/permissions.tsv，
      # 从没把结果灌回这里，role_permissions 的 FK 约束因此让"正向权限
      # 路径"（真的授予一个键、真的放行）在全项目历史上从未被真机验证过，
      # 只验证过 fail-closed 的拒绝路径。现在从 registry/permissions.tsv
      # 补齐（42 条，一条都不缺）——**改了 registry/permissions.tsv 之后
      # 要重新生成这一行**，命令：
      #   python3 -c "
      #   import csv
      #   with open('registry/permissions.tsv') as f:
      #       rows = [r for r in csv.DictReader(f, delimiter='\t') if not r['deprecated'].strip()]
      #   print(','.join(f\"{r['key']}|{r['title']}|{r['type']}|{r['owner_component']}\" for r in rows))"
      # 格式见 component.yaml 的字段注释：key|title|type|owner_component，
      # 条目间逗号分隔（阶段三 Task 4 设计决策）。
      permissionCatalog: "crm.opportunity.edit|编辑商机|action|crm/opportunity,crm.opportunity.view|查看商机|page|crm/opportunity,crm.opportunity.win|商机赢单|action|crm/opportunity,erp.finance.close|关账/反关账/锁定期间|action|erp/finance,erp.finance.manage_access|分配法人访问权限|action|erp/finance,erp.finance.post|手工过账/冲销|action|erp/finance,erp.finance.view|查看财务数据|page|erp/finance,erp.inventory.adjust|盘盈盘亏调整|action|erp/inventory,erp.inventory.issue|确认出库|action|erp/inventory,erp.inventory.manage_access|分配仓库访问权限|action|erp/inventory,erp.inventory.receive|入库|action|erp/inventory,erp.inventory.reserve|预留库存|action|erp/inventory,erp.inventory.view|查看库存|page|erp/inventory,erp.sales.cancel|取消订单|action|erp/sales,erp.sales.confirm|确认订单|action|erp/sales,erp.sales.create|建立报价/订单|action|erp/sales,erp.sales.ship|发货|action|erp/sales,erp.sales.view|查看销售订单|page|erp/sales,infra.authz.admin|权限与角色管理|page|infra/authz,infra.bff-mobile.customer.view|查询客户（移动端）|action|infra/bff-mobile,infra.bff-mobile.inventory.view|查询库存余量（移动端）|action|infra/bff-mobile,infra.bff-mobile.order.view|查询销售订单（移动端）|action|infra/bff-mobile,infra.bff-mobile.product.view|查询产品（移动端）|action|infra/bff-mobile,infra.bff-mobile.task.view|查询我的待办（移动端）|action|infra/bff-mobile,infra.notification.admin|通知排障视图|page|infra/notification,infra.notification.preference.edit|编辑通知偏好|action|infra/notification,infra.notification.view|查看我的通知|page|infra/notification,infra.print.render|调用渲染|action|infra/print,infra.print.template.edit|编辑打印模板|action|infra/print,infra.print.template.view|查看打印模板|page|infra/print,infra.workflow.admin|待办全局视图|page|infra/workflow,infra.workflow.task.act|处理待办（同意/驳回）|action|infra/workflow,infra.workflow.task.view|查看我的待办|page|infra/workflow,integration.im.admin|钉钉投递排障|page|integration/im-dingtalk,mdm.customer.add_contact|新增客户联系人|action|mdm/customer,mdm.customer.create|新建客户|action|mdm/customer,mdm.customer.set_status|启用/停用客户|action|mdm/customer,mdm.customer.update|编辑客户|action|mdm/customer,mdm.customer.view|查看客户主数据|page|mdm/customer,mdm.product.create|新建产品|action|mdm/product,mdm.product.edit|编辑产品|action|mdm/product,mdm.product.view|查看产品主数据|page|mdm/product"
  - id: infra/iam-casdoor
    version: 1.0.2 # 阶段三 Task 7：Casdoor 适配层建成，全系统第一次有真实
                   # 签发方能发出验签通过的 JWT——这一条上线之前，以上
                   # 六个组件配的 iamJwksUrl 都指向一个还不存在的地址。
                   # v1.0.1：真机部署+curl 验收时发现并修了 be-sdk-go 的
                   # RED 指标/访问日志中间件顺序 bug（升级到 v0.2.3）。
                   # v1.0.2：真机换真实 Casdoor id_token 时发现 OIDC 发现
                   # 文档给出的 jwks_uri 从容器内部连不通，加了 rebaseHost。
    expose: true # curl 打 HTTP 需要（主端口 8200），gRPC（9200）只能走容器 IP，同其余组件先例。
                 # 同时也是 Casdoor（带外容器，与本组件不在同一个 Docker 网络）
                 # 回调 webhook 用的落地端口——见 webhookCallbackUrl 注释。
    config:
      # Casdoor 是带外容器（infra/docker-compose.infra.yml 起的，不进
      # brickkit.yaml）——brickkit 管理的容器要用 host.docker.internal
      # 才能连到宿主机上跑的带外容器（同 postgres-shared/nats-shared 两个
      # 基础资源的既有先例）。Casdoor 的宿主机映射端口是 8000
      # （docker-compose.infra.yml 的 ports: ["8000:8000"]）。
      casdoorBaseUrl: "http://host.docker.internal:8000"
      # Casdoor 官方镜像内置组织 built-in 下的默认管理员，真机核对过
      # admin/123 在这个环境里能登录——本地开发密码，与其余组件密码
      # 同级对待，走 .env（见 CASDOOR_ADMIN_PASSWORD 定义处的注释）。
      casdoorAdminPassword: "${CASDOOR_ADMIN_PASSWORD}"
      # Casdoor 的 webhook 没有内置签名，本组件与 Casdoor 之间约定一个
      # 共享密钥放在自定义 header 里（真机核对过 Casdoor Webhook 对象
      # 支持自定义 header）。
      webhookSharedSecret: "${WEBHOOK_SHARED_SECRET}"
      # Casdoor（挂在带外的 be-net 网络）回调本组件用的地址：本组件是
      # brickkit 管理的容器，与 be-net 不是同一个 Docker 网络，Casdoor
      # 那一侧够不到 host.docker.internal（真机核对过，见 AGENTS.md/
      # 实测踩坑记录的网络拓扑记录）。正确路径是 be-net 桥接网络的网关 IP
      # （172.18.0.1，从 Casdoor 容器视角看就是"宿主机"）+ 本组件
      # expose 出来的宿主机端口（8200，与 component.yaml 的 deployment.port
      # 相同——expose: true 是端口对端口直映射，不走 10000+ 偏移那一套，
      # 那一套只用于 local:true 组件的依赖方地址映射，见导读第 14 条）。
      webhookCallbackUrl: "http://172.18.0.1:8200/api/iam/webhooks/casdoor"
      # 应用 token 的签名私钥（RSA，PEM）——本地开发自签，走 .env（同
      # 上面两项）。真实部署时这把钥匙需要和数据库密码同级对待，永远
      # 不进 git（.env 已在 .gitignore）。
      appTokenSigningKeyPem: "${APP_TOKEN_SIGNING_KEY_PEM}"
      # 必须与 infra-authz 的 accessTokenTtlSeconds（默认 600）一致——
      # 两边都没有显式配置，各自吃 component.yaml 的默认值，天生对齐，
      # 这里不需要重复写。
      # /api/tenant/features 的数据来源：本次装配启用的全部组件。
      enabledComponents: "mdm/customer,mdm/product,erp/inventory,erp/finance,erp/sales,infra/authz,infra/iam-casdoor"
      # 自引用：/api/iam/logout 用 besdk.Authenticated，全系统验应用
      # token 唯一的 JWKS 来源就是本组件自己（组件自己的 README/AGENTS.md
      # 已经解释过这是"真正意义上的自引用"，同 infra-authz 的
      # authzBundleUrl 自引用是同一个道理）。
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: infra/workflow
    version: 1.0.1 # 阶段三 Task 8 首次出档：审批待办中心，零依赖（§6.6 铁律三：
                   # 只有入边）。erp/sales@1.0.6 起已真的接通这条弱依赖调用
                   # （CreateTask 建异常待办，见 03-阶段三 Task 8 小节）。
                   # v1.0.1：Task 13 旁路发现并修复 event_outbox 缺周分区
                   # 维护循环的真实缺口（根 docs/dev/实测踩坑记录.md C12）
    expose: true # curl 打 HTTP 需要（主端口 8201），gRPC（9201）只能走容器 IP，同其余组件先例
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: infra/notification
    version: 1.0.2 # 阶段三 Task 9 首次出档：统一通知中心，零依赖零入边，
                   # 完全活在事件图上（消费 infra.workflow.task.created.v1
                   # 等，发 dispatch 事件；见 03-阶段三 Task 9 小节）
                   # v1.0.1：补数据权限边界测试（data-scope-test-scan 门禁发现零覆盖）。
                   # v1.0.2：consumer 测试改用测试私有 subject，避免同机真实容器抢消息（踩坑记录 E2）。
    expose: true # curl 打 HTTP 需要（主端口 8202），gRPC（9202）只能走容器 IP，同其余组件先例
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: integration/im-dingtalk
    version: 1.0.2 # 阶段三 Task 9：channel:im 族第一个成员，零依赖零入边
                   # （消费 infra.notification.dispatch.im.v1，发
                   # integration.im.result.v1）。⚠️ 2026-09-09 更新：建仓库
                   # 时用的是占位测试凭据，用户随后提供了真实钉钉个人团队
                   # 凭据（见 .env 的 DINGTALK_* 三项——不提交，已在
                   # .gitignore），真机验证过完整链路：CreateTask →
                   # infra-notification 路由 → 真实调钉钉 API → 真实收到
                   # 工作通知，notification_records 状态到 SENT。1.0.1/
                   # 1.0.2 是这次真机验证发现并修的两个真实 bug（03-阶段三
                   # Task 9 小节有完整记录）
    expose: true # curl 打 HTTP 需要（主端口 8207），gRPC（9207）只能走容器 IP，同其余组件先例
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
      dingtalkAppKey: "${DINGTALK_APP_KEY}"
      dingtalkAppSecret: "${DINGTALK_APP_SECRET}"
      dingtalkAgentId: "${DINGTALK_AGENT_ID}"
  - id: infra/print
    version: 1.0.2 # 阶段三 Task 10：全系统第一个 Python 组件，纯函数打印
                   # 渲染中心，零依赖零出边（erp/sales 等业务组件强依赖
                   # Render，本组件反过来不依赖任何人）。真机验证过完整
                   # 链路：真实 Postgres 迁移 → gRPC/HTTP 起服务 → 真实
                   # WeasyPrint 渲染一张带中文的 A4 PDF，pdftotext/pdftoppm
                   # 人工核对内容与模板对得上（03-阶段三 Task 10 小节）
    expose: true # curl/grpcurl 打通需要（主端口 8400），gRPC（9400）只能走容器 IP，同其余组件先例
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: infra/bff-mobile
    version: 1.0.3 # 阶段三 Task 11：全系统第一个 TypeScript 组件，GraphQL
                   # BFF，手写 schema 按前端页面裁剪，零强依赖零数据库
                   # （五条弱依赖：mdm/customer、mdm/product、erp/sales、
                   # erp/inventory、infra/workflow）。真机验证过完整链路：
                   # gRPC BatchGet（客户/产品）+ REST 转发（订单/库存/
                   # 待办，真项目 gRPC 组件间协议不做数据权限过滤，这三类
                   # 字段改走 REST 让下游各自的 REST 面去判）+ 401/403/200
                   # 三态 + Docker 镜像内 Node 20 真机跑通（03-阶段三
                   # Task 11 小节）；v1.0.2：弱依赖版本号同步跟进
                   # erp/sales@1.0.8、infra/workflow@1.0.1（实测踩坑记录
                   # C12），无破坏性变更；v1.0.3：弱依赖版本号同步跟进
                   # erp/sales@1.0.9（阶段三 Task 14），无破坏性变更
    expose: true
    exposePort: 28500 # registry/ports.tsv 的既有登记（决策 107：独立容器 exposePort 一律走 2xxxx 段）
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
  - id: frontend/standard
    version: 1.0.0 # 阶段三 Task 12：PC 独立 Vite SPA + 移动端 Uni-app H5，
                   # 共享 packages/design-tokens，唯一没有后端形态的组件
                   # （data_scopes: none，零依赖零数据库）。真机验证过完整
                   # OIDC+PKCE 登录链路、features ∩ permissions 动态路由、
                   # "前端判定不是安全边界"这条设计原则（03-阶段三 Task 12
                   # 小节）。PC 与移动端合用一个 Nginx 容器（PC 在 /，
                   # 移动端在 /m/）。
    expose: true
    exposePort: 28090 # registry/ports.tsv 的既有登记（slot:frontend 族共用 80，独立容器 exposePort 走 2xxxx 段）
    config:
      gatewayBaseUrl: "/api" # ⚠️ 本阶段真机验证走的是各组件直连端口（Vite 开发期代理），
                             # 没有实际验证过经 Traefik 网关这条真实路径——上线前需要
                             # 用真实网关地址重新走一遍登录+业务页面全链路
      iamIssuerUrl: "http://localhost:8000" # Casdoor 浏览器直连地址，随部署环境的真实公网域名替换
      casdoorClientId: "" # 部署时用 Casdoor 管理 API 现查 brickkit-app 的 client_id 填入，不提交真实值
  - id: crm/opportunity
    version: 1.0.1 # v1.0.1：补数据权限边界测试（data-scope-test-scan 门禁发现零覆盖）。
                   # 阶段三 Task 13：阶段三第一个业务组件、CRM 域第一个组件。
                   # 商机全生命周期，两条强依赖（mdm/customer、mdm/product 的
                   # BatchGet），明确不依赖任何 erp-*/infra-workflow（§1.4 铁律：
                   # CRM 与 ERP 零同步边，仅事件握手）。MarkWon 真机验证过
                   # 完整链路：状态转 WON + Outbox 记录 + 事件真的发布到 NATS
                   # 总线（03-阶段三 Task 13 小节）。
    expose: true # curl 打 HTTP 需要，gRPC 只能走容器 IP
    config:
      authzBundleUrl: "http://infra-authz-1-0-2:8223/authz/bundle"
      iamJwksUrl: "http://infra-iam-casdoor-1-0-2:8200/.well-known/jwks.json"
