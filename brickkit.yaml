    # ⚠️ expose: true/exposePort 原来写在这里——servedBy 成员不生成容器，
    # 这两个字段对它不生效（brickKit 只打印警告，是已知的"实施勘误"），
    # 已删掉，不留一份写了不生效的配置。验证这个模块自己的端点改走
    # docker exec 进外壳容器 + curl 容器内部地址，见 docs/plans/
    # 04b-验证记录.md Task 0.4/0.5。
    config:
      # 阶段三 Task 6：bundle 轮询指向真实跑着的 infra-authz——没有依赖边，
      # brickKit 不会帮忙注入，只能手写字面量，infra/authz 升版本时这几处
      # 要跟着改（阶段四调研记录/踩坑记录 C18）。
      #
      # ⚠️ 阶段四 Task 6 原子式切换后新增的判据，servedBy 落地后依然成立
      # （阶段四附加 Task 0.4）：全仓库 13 处 authzBundleUrl/iamJwksUrl 都要
      # 按这条规则手动同步——不管是旧的 local:true 还是现在的 servedBy，
      # brickKit 的依赖地址自动合并/改写都只覆盖 dependencies.components
      # 声明出来的 *_ENDPOINT，这两项是纯字面量 configSchema 值，从来不在
      # 那条自动路径上：infra/authz、infra/iam-casdoor
      # 现在合并进 go-infra 外壳——跟它们**同一个外壳**的组件（infra/workflow、
      # infra/notification、integration/im-dingtalk，以及 infra/authz、
      # infra/iam-casdoor 自身的自引用）写 http://127.0.0.1:<port>（同进程
      # loopback）；跟它们**不同外壳或仍是独立容器**的组件（本组件、
