# brickkit.yaml - BrickKit 项目配置
# 由 brickkit init 生成，由用户编辑，由 CLI 读取
project: be-assembly-standard

deploy:
  target: docker # docker | k8s

# 安装源：按声明顺序依次尝试，前一个找不到就试下一个（003 §6.5）
sources:
  - id: local-dev
    type: local
    path: ./components # brickkit init 已经建好这个目录
# 组件市场按需取消注释并填上地址：
# - id: brickkit-market
#   type: market
#   url: https://market.example.com/api/v1

components:
  - id: mdm/customer
    version: 1.0.0
    expose: true # 档 0 验收要用 curl 从宿主机直接打 HTTP（Task 17 步骤 2）。
                 # ⚠️ 只映射主端口（8080），额外端口（gRPC 9090）expose 与否
                 # 都不会映射到宿主机（brickKit internal/compose/local.go
                 # 的 mapDependencyToHost 注释原话："额外端口一个都不在里面"，
                 # 且那整套映射只在"被某个 local:true 组件依赖"时才生效——
                 # mdm-customer 没有被任何 local 组件依赖，gRPC 端口验收
                 # 只能走容器的 Docker 网络 IP，见 Task 17 步骤 3。
  - id: mdm/product
    version: 1.0.0
    expose: true # 同 mdm-customer：curl 打 HTTP 需要，gRPC 只能走容器 IP
  - id: erp/inventory
    version: 1.0.2 # v1.0.1/v1.0.2：GetReservationStatus 补 idempotency_key
                   # 查询路径（erp-sales Task 17 发现的契约缺口），无破坏性变更
    expose: true # 同上：curl 打 HTTP 需要，gRPC 只能走容器 IP
  - id: erp/finance
    version: 1.0.1 # v1.0.1：消费 sales.order.created.v1 的字段名对齐
                   # erp-sales 真实契约（amount → total_amount），无破坏性变更
    expose: true # 同上：curl 打 HTTP 需要，gRPC 只能走容器 IP
  - id: erp/sales
    version: 1.0.1 # v1.0.1：依赖版本跟进 erp/finance@1.0.1
    expose: true # 同上：curl 打 HTTP 需要，gRPC 只能走容器 IP。
                 # Task 18：五组件一起 up，跑通 CreateOrder → 预留库存 →
                 # 生成应收这条最短链路（docs/plans/02-阶段二-验平台.md）。
    config:
      # ConfirmOrder 发起 Reserve 时统一用这一个仓库（设计计划 §9 第 9 条：
      # 阶段二没有多仓选货逻辑）。"1" 是 erp-inventory 迁移播种的 WH-EAST
      # 的真实 id（003_seed_warehouses.up.sql，真机查过 warehouses 表）。
      defaultWarehouseId: "1"
resources:
  - id: postgres-shared
    kind: database
    engine: postgresql
    host: host.docker.internal
    port: 5432
    username: postgres
    password: ${POSTGRES_PASSWORD}
    bindings:
      - componentId: mdm/customer
        database: brickkit_db
      - componentId: mdm/product
        database: brickkit_db
      - componentId: erp/inventory
        database: brickkit_db
      - componentId: erp/finance
        database: brickkit_db
      - componentId: erp/sales
        database: brickkit_db
  - id: nats-shared
    kind: mq
    engine: nats
    host: host.docker.internal
    port: 4222
    bindings:
      - componentId: mdm/customer
      - componentId: mdm/product
      - componentId: erp/inventory
      - componentId: erp/finance
      - componentId: erp/sales
