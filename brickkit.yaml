ra.workflow.task.view|查看我的待办|page|infra/workflow,integration.im.admin|钉钉投递排障|page|integration/im-dingtalk,mdm.customer.add_contact|新增客户联系人|action|mdm/customer,mdm.customer.create|新建客户|action|mdm/customer,mdm.customer.set_status|启用/停用客户|action|mdm/customer,mdm.customer.update|编辑客户|action|mdm/customer,mdm.customer.view|查看客户主数据|page|mdm/customer,mdm.product.create|新建产品|action|mdm/product,mdm.product.edit|编辑产品|action|mdm/product,mdm.product.view|查看产品主数据|page|mdm/product","PG_SCHEMA":"infra_authz"}},{"componentId":"infra/iam-casdoor","version":"1.0.9","schema":"infra_iam_casdoor","httpPort":8200,"extraPorts":{"grpc":9200},"config":{"APP_TOKEN_PREVIOUS_PUBLIC_KEY_PEM":"","APP_TOKEN_TTL_SECONDS":"600","CASDOOR_ADMIN_USERNAME":"admin","CASDOOR_APP_NAME":"brickkit-app","CASDOOR_BASE_URL":"http://host.docker.internal:8000","CASDOOR_ORG_NAME":"brickkit","ENABLED_COMPONENTS":"mdm/customer,mdm/product,erp/inventory,erp/finance,erp/sales,infra/authz,infra/iam-casdoor","IAM_JWKS_URL":"http://127.0.0.1:8200/.well-known/jwks.json","OTEL_BASE_URL":"","PG_SCHEMA":"infra_iam_casdoor","REFRESH_TOKEN_TTL_SECONDS":"604800","WEBHOOK_CALLBACK_URL":"http://172.18.0.1:8200/api/iam/webhooks/casdoor"}},{"componentId":"infra/notification","version":"1.0.4","schema":"infra_notification","httpPort":8202,"extraPorts":{"grpc":9202},"config":{"AUTHZ_BUNDLE_URL":"http://127.0.0.1:8223/authz/bundle","IAM_JWKS_URL":"http://127.0.0.1:8200/.well-known/jwks.json","IM_TARGET_ADAPTERS":"dingtalk","OTEL_BASE_URL":"","PG_SCHEMA":"infra_notification"}},{"componentId":"infra/workflow","version":"1.0.4","schema":"infra_workflow","httpPort":8201,"extraPorts":{"grpc":9201},"config":{"AUTHZ_BUNDLE_URL":"http://127.0.0.1:8223/authz/bundle","IAM_JWKS_URL":"http://127.0.0.1:8200/.well-known/jwks.json","OTEL_BASE_URL":"","PG_SCHEMA":"infra_workflow"}},{"componentId":"integration/im-dingtalk","version":"1.0.5","schema":"integration_im_dingtalk","httpPort":8207,"extraPorts":{"grpc":9207},"config":{"AUTHZ_BUNDLE_URL":"http://127.0.0.1:8223/authz/bundle","DINGTALK_BASE_URL":"https://oapi.dingtalk.com","IAM_JWKS_URL":"http://127.0.0.1:8200/.well-known/jwks.json","OTEL_BASE_URL":"","PG_SCHEMA":"integration_im_dingtalk"}}]'
      # go-infra 自己就是 infra/authz、infra/iam-casdoor 所在的外壳——
      # 同进程 loopback，不是 host.docker.internal（同这两个组件自引用的
      # 既有判据）。
      authzBundleUrl: "http://127.0.0.1:8223/authz/bundle"
      iamJwksUrl: "http://127.0.0.1:8200/.well-known/jwks.json"
      # ⚠️ 阶段四附加 Task 0.4：以下 6 项是真实的秘钥，原来分别是
      # infra/iam-casdoor、integration/im-dingtalk 各自 component.yaml
      # 上的 configSchema 项——真机验证 servedBy 时发现它们不能像其它
      # config 项那样走 shellConfigJson（这类值整个是 ${VAR} 占位符，
      # be-ops 的 MergeConfig 会把它们整条排除：带真实换行符会破坏 JSON
      # 结构，展开后的真实密钥又不能提交进 git，完整推演见 be-ops
      # genyaml.MergeConfig 的注释）。这里走的是正常的 ${VAR} 展开路径
      # （跟其它任何一个组件的秘钥项完全一样），brickKit 原生注入引擎
      # 会把它们展开成外壳容器自己的进程环境变量，internal/shell.
      # envWithProcessFallback 再兜底传给真正需要它们的模块。
      appTokenSigningKeyPem: "${APP_TOKEN_SIGNING_KEY_PEM}"   # → infra/iam-casdoor
      casdoorAdminPassword: "${CASDOOR_ADMIN_PASSWORD}"       # → infra/iam-casdoor
      webhookSharedSecret: "${WEBHOOK_SHARED_SECRET}"         # → infra/iam-casdoor
      dingtalkAppKey: "${DINGTALK_APP_KEY}"                   # → integration/im-dingtalk
      dingtalkAppSecret: "${DINGTALK_APP_SECRET}"             # → integration/im-dingtalk
      dingtalkAgentId: "${DINGTALK_AGENT_ID}"                 # → integration/im-dingtalk
